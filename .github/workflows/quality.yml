name: Quality

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npm run test:e2e:install:ci
      - name: Run repository quality gate
        run: npm run verify

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bkyexam_test
          POSTGRES_USER: bkyexam
          POSTGRES_PASSWORD: bkyexam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bkyexam -d bkyexam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bkyexam:bkyexam@127.0.0.1:5432/bkyexam_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run PostgreSQL integration profile
        run: npm run test:integration:db
