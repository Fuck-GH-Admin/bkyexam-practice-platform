services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bkyexam_practice
      POSTGRES_USER: bkyexam
      POSTGRES_PASSWORD: bkyexam
    volumes:
      - practice_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bkyexam -d bkyexam_practice"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    ports:
      - "${POSTGRES_TEST_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: bkyexam_test
      POSTGRES_USER: bkyexam
      POSTGRES_PASSWORD: bkyexam
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bkyexam -d bkyexam_test"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  practice_postgres_data:
